<svg width="200" height="60" viewBox="20 28 200 60" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- 10px-corner variant (for buttons on light sections). Pill per the supplied button design: black body, violet hairline, a light wave rising
     in the bottom-right corner (violet edge, near-white crest). The wave drifts slowly. -->
<rect x="20" y="28" width="200" height="60" rx="15" fill="black"/>
<mask id="m" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="20" y="28" width="200" height="60"><rect x="20" y="28" width="200" height="60" rx="15" fill="black"/></mask>
<g mask="url(#m)">
 <g filter="url(#b7)"><path d="M96 92C126 86 156 66 192 63C212 61.5 226 66 234 74V100H96Z" fill="#7773FF">
  <animateTransform attributeName="transform" type="translate" values="0 0;-14 2;0 0" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></path></g>
 <g filter="url(#b4)"><path d="M120 94C146 88 170 76 194 73.5C210 72 220 75 228 80V100H120Z" fill="url(#crest)">
  <animateTransform attributeName="transform" type="translate" values="0 1;-18 -1.5;0 1" dur="3.4s" begin=".3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></path></g>
 <g filter="url(#b3)" opacity=".9"><path d="M142 94C162 89 180 83 198 81.5C208 80.8 216 82.5 222 86V100H142Z" fill="#fff">
  <animateTransform attributeName="transform" type="translate" values="0 0;10 -1;0 0" dur="2.8s" begin=".6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></path></g>
</g>
<rect x="20.5" y="28.5" width="199" height="59" rx="14.5" stroke="url(#st)"/>
<defs>
 <filter id="b7" x="60" y="50" width="200" height="70" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="6"/></filter>
 <filter id="b4" x="90" y="60" width="160" height="60" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="b3" x="120" y="70" width="120" height="40" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="2.2"/></filter>
 <linearGradient id="st" x1="20" y1="58" x2="220" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#8E97FF"/><stop offset="1" stop-color="#CFD7FF"/></linearGradient>
 <linearGradient id="crest" x1="128" y1="90" x2="226" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#A99BFF" stop-opacity=".6"/><stop offset=".55" stop-color="#E6DEFF"/><stop offset="1" stop-color="#C9B3FF"/></linearGradient>
</defs>
</svg>
