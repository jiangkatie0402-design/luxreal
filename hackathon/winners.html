  const poster = id => POSTERS[id] || '';
  // clips are the demo files next to this page (assets/demo/…); MP4 first, WebM fallback
  const FILES = {demoZen: 'zen',demoVillage: 'village',demoElf: 'elf',demoSnow: 'snow',demoFly: 'fly'};
  const ext = document.createElement('video').canPlayType('video/mp4; codecs="avc1.4d401e"') ? 'mp4' : 'webm';
  const clip = id => `assets/demo/${FILES[id]}.${ext}`;
  const media = (w, label) => `<button type="button" class="wn-media" data-clip="${W[w].v}" data-cap="${esc(label)}" aria-label="${esc(label)}"><img src="${poster(W[w].v)}" alt="" loading="lazy"><video muted loop playsinline preload="none"></video></button>`;
  const tags = w => `<div class="wn-tags">${W[w].tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>`;
  function render() {
    const g = WINNERS.grand, gw = W[g.w];
    document.getElementById('wnSub').innerHTML = en() ? '<b>23</b> awards · <b>¥320,000</b> in prizes' : '共 <b>23</b> 项奖项 · 奖金总额 <b>¥320,000</b>';
    document.getElementById('wnGrand').innerHTML = `<article class="wn-grand">${media(g.w, L(gw.t))}<div>
      <p class="wn-award">${en() ? '3D AI New Species Award' : '3D AI 新物种奖'}</p><span class="wn-amt">¥100,000</span>
      <h3 class="wn-name">${esc(L(gw.t))}</h3><p class="wn-team">${esc(L(g.team))}</p><p class="wn-desc">${esc(L(gw.d))}</p>${tags(g.w)}
      <div class="wn-acts"><button type="button" class="btn btn-primary" data-play="${gw.v}" data-cap="${esc(L(gw.t))}">${en() ? 'Watch the demo' : '观看演示'}</button></div></div></article>`;
    document.getElementById('wnRanks').innerHTML = WINNERS.ranks.map(r => `<div class="wn-rank"><div class="wn-rank-head"><span class="wn-award">${esc(L(r.name))} <i>${r.amt} × ${r.items.length}</i></span></div>
      <div class="wn-grid n${r.items.length}">${r.items.map(it => { const w = W[it.w]; return `<article class="wn-card">${media(it.w, L(w.t))}<div>
        <h3 class="wn-name">${esc(L(w.t))}</h3><p class="wn-team">${esc(L(it.team))}</p><p class="wn-desc">${esc(L(w.d))}</p>${r.items.length === 1 ? tags(it.w) : ''}</div></article>`; }).join('')}</div></div>`).join('');
    let n = 7;
    document.getElementById('wnSingles').innerHTML = WINNERS.singles.map(gr => `<div class="wn-group"><h3>${esc(L(gr.name))}<em>× ${gr.n} · ¥5,000 / ${en() ? 'each' : '项'}</em></h3>
      ${gr.items.map(([aw, w]) => `<div class="wn-row">${media(w, L(W[w].t))}<div><p class="wn-aw">${esc(L(aw))}</p><p class="wn-name">${esc(L(W[w].t))}</p><p class="wn-team">${esc(L(team(++n)))}</p></div></div>`).join('')}</div>`).join('');
    wire();
  }
  // hover (or focus) plays the clip in place; the grand prize plays while it is on screen
  let io;
  function wire() {
    if (io) io.disconnect();
    io = new IntersectionObserver(es => es.forEach(({ target: m, isIntersecting: on }) => on ? play(m) : stop(m)), { threshold: .4 });
    root.querySelectorAll('.wn-media').forEach(m => {
      if (m.closest('.wn-grand')) { if (!reduceMotion) io.observe(m); return; }
      m.addEventListener('pointerenter', () => play(m)); m.addEventListener('pointerleave', () => stop(m));
      m.addEventListener('focus', () => play(m)); m.addEventListener('blur', () => stop(m));
    });
  }
  function play(m) { if (reduceMotion) return; const v = m.querySelector('video'); if (!v.src) v.src = clip(m.dataset.clip); v.play().then(() => m.classList.add('playing')).catch(() => {}); }
  function stop(m) { const v = m.querySelector('video'); v.pause(); m.classList.remove('playing'); }
  // click → full player
  const lb = document.createElement('div'); lb.className = 'lb'; lb.hidden = true; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true');
  lb.innerHTML = '<div class="lb-box"><button type="button" class="lb-x" aria-label="Close">×</button><video controls playsinline loop></video><p class="lb-cap"></p></div>';
  document.body.append(lb); const lbv = lb.querySelector('video');
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-clip], [data-play]'); if (!b) return;
    lbv.src = clip(b.dataset.clip || b.dataset.play); lb.querySelector('.lb-cap').textContent = b.dataset.cap || '';
    lb.hidden = false; document.body.classList.add('modal-open'); lbv.play().catch(() => {}); lb.querySelector('.lb-x').focus();
  });
  const close = () => { if (lb.hidden) return; lbv.pause(); lb.hidden = true; document.body.classList.remove('modal-open'); };
  lb.addEventListener('click', e => { if (e.target === lb || e.target.closest('.lb-x')) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  // the tab for the section in view lights up
  const tabs = [...root.querySelectorAll('.wn-tabs a')];
  const tabsIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) tabs.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  root.querySelectorAll('.wn-sec').forEach(sec => tabsIO.observe(sec));
  let built = false;
  window.wnRender = () => { render(); built = true; };
  if (!root.hidden) window.wnRender();                                   // opened straight on #/winners: the router ran before this script
  document.addEventListener('langchange', () => { if (built) render(); });
})();
</script>
