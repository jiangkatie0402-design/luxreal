<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxReal — 从商品视频到短剧</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0c0c0e;
    --surface:  #141416;
    --surface2: #1c1c1f;
    --border:   rgba(255,255,255,0.09);
    --border2:  rgba(255,255,255,0.15);
    --text:     #f0f0f2;
    --text2:    rgba(240,240,242,0.5);
    --text3:    rgba(240,240,242,0.28);
  }

  html, body { min-height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

  /* topbar (shared with app) */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px; gap: 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(12,12,14,0.8); backdrop-filter: blur(16px);
  }
  .topbar-logo { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; letter-spacing: -0.3px; flex-shrink: 0; }
  .logo-mark { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .logo-mark svg { width: 100%; height: 100%; }

  .topbar-nav { display: flex; align-items: center; gap: 30px; }
  .nav-link {
    font-size: 14px; font-weight: 500; color: var(--text2); text-decoration: none;
    white-space: nowrap; transition: color .15s;
  }
  .nav-link:hover { color: var(--text); }

  .topbar-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }

  .lang-toggle {
    display: flex; align-items: center; gap: 2px; padding: 3px;
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 20px;
  }
  .lang-opt {
    border: none; background: transparent; color: var(--text2);
    font-size: 12px; font-weight: 500; padding: 5px 13px; border-radius: 16px;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .lang-opt.active { background: #fff; color: #0c0c0e; }
  .lang-opt:not(.active):hover { color: var(--text); }

  .avatar-btn {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--border2); cursor: pointer;
    background: linear-gradient(135deg,#3a4256,#20242f);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .avatar-btn:hover { transform: scale(1.06); }
  .avatar-btn svg { width: 20px; height: 20px; }

  @media (max-width: 980px) {
    .topbar-nav { display: none; }
  }

  /* HERO */
  .hero-wrap { padding: 88px 24px 24px; }
  .hero-shot {
    position: relative; border-radius: 20px; overflow: hidden;
    aspect-ratio: 16/7.4; background: #05060a;
    display: flex; align-items: flex-end;
  }
  .hero-shot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hero-text {
    position: absolute; z-index: 2; top: 49%; left: 50%; transform: translate(-50%,-50%);
    font-size: 48px; font-weight: 600; letter-spacing: 0.02em; color: #fff;
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .hero-shot { aspect-ratio: 9/12; }
    .hero-text { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 9L8.5 3.5H15.5L20 9L12 20.5L4 9Z" stroke="#f0f0f2" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M4 9H20M8.5 3.5L11 9M15.5 3.5L13 9M11 9L12 20.5M13 9L12 20.5" stroke="#f0f0f2" stroke-width="1" stroke-linejoin="round" opacity="0.55"/>
      </svg>
    </div>
    LuxReal
  </div>

  <nav class="topbar-nav">
    <a href="index.html" class="nav-link">首页</a>
    <a href="#" class="nav-link">应用场景</a>
    <a href="#" class="nav-link">核心优势</a>
    <a href="#" class="nav-link">产品特点</a>
    <a href="create.html" class="nav-link">快速上手</a>
    <a href="#" class="nav-link">关于我们</a>
    <a href="#" class="nav-link">隐私政策</a>
  </nav>

  <div class="topbar-right">
    <div class="lang-toggle">
      <button class="lang-opt" onclick="setLang(this)">English</button>
      <button class="lang-opt active" onclick="setLang(this)">中文</button>
    </div>
    <div class="avatar-btn" title="Assistant">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M8 3.5c-.6 1.6-.6 3.4 0 5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M16 3.5c.6 1.6.6 3.4 0 5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="13" r="6" fill="#fff" opacity="0.95"/>
        <circle cx="9.7" cy="12.6" r="1" fill="#3a4256"/>
        <circle cx="14.3" cy="12.6" r="1" fill="#3a4256"/>
        <circle cx="12" cy="14.6" r="0.9" fill="#ff8a9a"/>
      </svg>
    </div>
  </div>
</div>

<div class="hero-wrap">
  <div class="hero-shot">
    <svg viewBox="0 0 1600 750" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0a0f24"/>
          <stop offset="45%" stop-color="#141d3f"/>
          <stop offset="62%" stop-color="#241f38"/>
          <stop offset="78%" stop-color="#120e18"/>
          <stop offset="100%" stop-color="#040406"/>
        </linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7b9fff"/>
          <stop offset="30%" stop-color="#a86cff"/>
          <stop offset="55%" stop-color="#ff6f8f"/>
          <stop offset="80%" stop-color="#ffb15c"/>
          <stop offset="100%" stop-color="#ffb15c" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="glow" cx="15%" cy="55%" r="55%">
          <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#04040a" stop-opacity="0"/>
          <stop offset="45%" stop-color="#04040a" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#04040a" stop-opacity="0.98"/>
        </linearGradient>
        <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="26"/>
        </filter>
        <filter id="blurTight" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <rect width="1600" height="750" fill="url(#sky)"/>
      <rect width="1600" height="750" fill="url(#glow)"/>

      <!-- reflection (flipped, faded) -->
      <g opacity="0.28" transform="translate(0,860) scale(1,-1)">
        <path d="M0,410 C300,392 620,300 900,150 C1120,55 1340,35 1600,120 L1600,470 C1330,412 1150,462 950,555 C700,655 380,478 0,428 Z" fill="url(#beam)" filter="url(#blurSoft)"/>
      </g>

      <!-- main beam / unfurled ribbon -->
      <path d="M0,410 C300,392 620,300 900,150 C1120,55 1340,35 1600,120 L1600,470 C1330,412 1150,462 950,555 C700,655 380,478 0,428 Z" fill="url(#beam)" filter="url(#blurSoft)" opacity="0.9"/>
      <path d="M0,415 C300,398 610,308 890,162 C1105,64 1320,44 1600,124" fill="none" stroke="#ffe9d6" stroke-width="2.5" opacity="0.55" filter="url(#blurTight)"/>

      <rect x="0" y="380" width="1600" height="370" fill="url(#floorFade)"/>

      <!-- silhouette -->
      <g transform="translate(955,472)">
        <ellipse cx="0" cy="-62" rx="6.5" ry="8" fill="#050409"/>
        <path d="M-8,-50 C-8,-54 8,-54 8,-50 L11,-8 L6,-8 L6,40 L-6,40 L-6,-8 L-11,-8 Z" fill="#050409"/>
      </g>
    </svg>
    <div class="hero-text">从商品视频到短剧</div>
  </div>
</div>

<script>
function setLang(el) {
  el.parentElement.querySelectorAll('.lang-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
