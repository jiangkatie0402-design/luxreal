<!-- ================================================================
  赛事合作伙伴 logo 滚动条 — 从 hackathon/index.html 抽出的完整代码（CSS + HTML + JS）
  两排：上排 企业与媒体（小红书科技 · 观猹 · 魔搭社区 · WaytoAGI · Insta360 · 云深处科技 · 硅星人，较短，脚本会自动重复以保证无缝）；下排 反向滚动（北大 · 清华深研院 · 浙大 · 哈工深 · 港科大 · 复旦上医 · 上海交大 · 同济 · 探臻科技评论 · FluxTech 南客松）
  每个 logo 的视觉高度写在各自 img 的 style 里（height），做光学大小匹配；图片源文件在 hackathon/assets/partners/（高校社团和 FluxTech 为矢量 SVG）

  给开发：
  · 17 个 logo 已全部以 base64 内嵌在下面的 <img src="data:..."> 里，这一个文件就够用，不需要另外拿图片；
    原始文件（SVG / PNG）也放在仓库 hackathon/assets/partners/，想改成外链图片时可替换 src。
  · 放进页面时：<style> 里的规则并入样式表，HTML 放在倒计时条下方，<script> /* partner strip: start drifting (from the first logo) only once it is on screen */
(function () {
  document.querySelectorAll('.pt-marquee').forEach(m => {
    const set = m.querySelector('.pt-set'), t = m.querySelector('.pt-track'); if (!set || !t) return;
    const sets = t.querySelectorAll('.pt-set'), one = set.innerHTML;          // a short row is repeated inside each set so a set is always wider than the strip (no gap at the loop)
    for (let n = 0; set.offsetWidth < m.clientWidth * 1.1 && n < 4; n++) sets.forEach(s => s.insertAdjacentHTML('beforeend', one));
    t.style.animationDuration = (set.offsetWidth / 40).toFixed(1) + 's';   // ~40px/s whatever the row length
    new IntersectionObserver(([e], o) => { if (e.isIntersecting) { m.classList.add('run'); o.disconnect(); } }, { threshold: .5 }).observe(m);
  });
})();
</script>
