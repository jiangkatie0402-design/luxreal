<style>
:root { --bg-2: #0b0b0e; --border-subtle: rgba(255,255,255,.08); --text: #f4f4f6; --text-muted: #8a8a94; }   /* page tokens */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.partners { display: flex; align-items: center; justify-content: space-between; gap: 12px 32px; flex-wrap: wrap; padding-block: 18px 22px; border-top: 1px solid var(--border-subtle); }
.partners { flex-wrap: nowrap; }
.partners .pt-note { white-space: nowrap; flex-shrink: 0; }
@media (max-width: 640px) { .partners { flex-wrap: wrap; } .pt-marquee { flex-basis: 100%; } }
/* partner strip: logos drift left in an endless loop (two identical sets, the track slides by one set) */
.pt-marquee { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
.pt-marquee::before, .pt-marquee::after { content: ''; position: absolute; top: 0; bottom: 0; z-index: 1; width: 48px; pointer-events: none; }
.pt-marquee::before { width: 20px; }
.pt-marquee::before { left: 0; background: linear-gradient(90deg, var(--bg-2), transparent); }
.pt-marquee::after { right: 0; background: linear-gradient(270deg, var(--bg-2), transparent); }
.pt-track { display: flex; width: max-content; animation: ptDrift 60s linear infinite paused; will-change: transform; }
/* starts from the first logo once the strip is on screen; hover pauses it */
.pt-marquee.run .pt-track { animation-play-state: running; }
.pt-marquee.run:hover .pt-track { animation-play-state: paused; }
.pt-set { display: flex; align-items: center; gap: clamp(36px, 4vw, 64px); padding-left: 24px; padding-right: calc(clamp(36px, 4vw, 64px) - 24px); }
.pt-role { font-size: 15px; color: var(--text-muted); white-space: nowrap; margin-right: calc(clamp(36px, 4vw, 64px) * -1 + 14px); }
.pt-logo { display: flex; align-items: center; height: 56px; white-space: nowrap; }   /* room for 硅星人's bubble tail: its text, not the whole mark, sits on the centre line */
.pt-logo img { display: block; width: auto; }   /* each logo carries its own optical height */
.pt-word { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: .01em; }
@keyframes ptDrift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
@media (prefers-reduced-motion: reduce) { .pt-track { animation: none; } .pt-set[aria-hidden] { display: none; } .pt-set { flex-wrap: wrap; row-gap: 12px; } }
.pt-note { font-size: 13px; color: var(--text-muted); }
.partners .pt-fixed { margin: 0; flex-shrink: 0; }
</style>
