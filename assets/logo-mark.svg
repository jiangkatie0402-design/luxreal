<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Vector reference for the LuxReal icon's 4 light rays, used by intro.js
    to drive the opening-animation beam angles and the nav-logo landing
    flash. Angles (measured counter-clockwise from horizontal, screen
    space, origin at ray convergence point):
      ray-a: 60.4deg - 76deg
      ray-b: 49.6deg - 56.1deg
      ray-c: 32.5deg - 39.8deg
      ray-d: 10deg   - 28deg
  -->
  <defs>
    <clipPath id="luxreal-icon-clip">
      <rect x="0" y="0" width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#luxreal-icon-clip)" fill="#ffffff">
    <path id="ray-a" data-blade="A" data-angle-min="60.4" data-angle-max="76"
          d="M 15.00,92.00 L 79.21,-21.03 L 46.45,-34.14 Z"/>
    <path id="ray-b" data-blade="B" data-angle-min="49.6" data-angle-max="56.1"
          d="M 15.00,92.00 L 99.26,-7.00 L 87.51,-15.90 Z"/>
    <path id="ray-c" data-blade="C" data-angle-min="32.5" data-angle-max="39.8"
          d="M 15.00,92.00 L 124.64,22.15 L 114.88,8.79 Z"/>
    <path id="ray-d" data-blade="D" data-angle-min="10" data-angle-max="28"
          d="M 15.00,92.00 L 143.03,69.43 L 129.78,30.97 Z"/>
  </g>
</svg>
